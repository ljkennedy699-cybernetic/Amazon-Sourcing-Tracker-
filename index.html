<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sourcing Tracker">
<title>Sourcing Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#6b7280}h1{font-size:28px;margin:4px 0 0}.icon{border:0;background:#fff;border-radius:12px;padding:11px}.progress{background:#111827;color:#fff;border-radius:20px;padding:20px;margin-bottom:18px}.progressTop{display:flex;justify-content:space-between;font-size:14px}.bar{height:9px;background:#374151;border-radius:9px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:#fff}.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;font-size:23px}.stats span{font-size:11px;color:#cbd5e1}.actions{display:grid;gap:11px}.action{width:100%;display:grid;grid-template-columns:52px 1fr 20px;align-items:center;text-align:left;border:0;border-radius:17px;padding:15px 14px;background:#fff;box-shadow:0 2px 8px #0001}.plus{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900}.green .plus{background:#dcfce7;color:#15803d}.blue .plus{background:#dbeafe;color:#2563eb}.yellow .plus{background:#fef3c7;color:#b45309}.action strong,.action small{display:block}.action small{color:#6b7280;margin-top:3px;font-size:12px}.tools{display:flex;justify-content:space-between;margin:15px 2px 20px}.tools button,.back{border:0;background:none;color:#4b5563;font-weight:700}.summary,.day,.setting,.legend{background:#fff;border-radius:17px;padding:16px;box-shadow:0 2px 8px #00000009;margin-bottom:12px}.summaryTitle{font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between}.summaryTitle span,.day span{font-size:11px;color:#6b7280;font-weight:500}.row{display:grid;grid-template-columns:48px 12px 1fr auto;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #f0f1f3;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.green{background:#22c55e}.dot.blue{background:#3b82f6}.dot.yellow{background:#f59e0b}.empty{text-align:center;color:#9ca3af;padding:25px 5px;font-size:13px}.pageTitle{display:flex;align-items:center;gap:8px;margin:8px 0 18px}.pageTitle h2{margin:0}.setting{display:flex;justify-content:space-between;align-items:center}.setting span{display:block;font-size:12px;color:#6b7280;margin-top:4px}.setting input{width:70px;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-weight:700}.legend div{display:grid;grid-template-columns:18px 1fr auto;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}.legend div:last-child{border:0}.danger{width:100%;border:0;background:#fee2e2;color:#b91c1c;border-radius:14px;padding:14px;font-weight:800}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:#9ca3af;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}nav button.active{color:#111827}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:800;z-index:10}
</style>
</head>
<body><div id="root"></div>
<script>
const T={quick:{n:"Quick",t:1,c:"green",d:"Sidebar / quick check"},deep:{n:"Deep",t:2,c:"blue",d:"Amazon page analysed"},verified:{n:"Verified",t:3,c:"yellow",d:"Profitable / ready to sheet"}};
let events=JSON.parse(localStorage.getItem("stEvents")||"[]"),target=+localStorage.getItem("stTarget")||50,tab="track";
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem("stEvents",JSON.stringify(events))}
function add(k){events.unshift({id:Date.now(),k,date:today(),time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})});save();render();toast("+"+T[k].t+" tick"+(T[k].t>1?"s":"")+" added")}
function row(e){let x=T[e.k];return `<div class="row"><span>${e.time}</span><span class="dot ${x.c}"></span><b>${x.n}</b><strong>+${x.t}</strong></div>`}
function setTab(x){tab=x;render()}
function track(){let es=events.filter(e=>e.date===today()),ticks=es.reduce((s,e)=>s+T[e.k].t,0);return `<header><div><div class="eyebrow">AMAZON SOURCING</div><h1>Sourcing Tracker</h1></div><button class="icon" onclick="setTab('settings')">⚙️</button></header><section class="progress"><div class="progressTop"><span>Today's progress</span><b>${ticks} / ${target} ticks</b></div><div class="bar"><div style="width:${Math.min(100,ticks/target*100)}%"></div></div><div class="stats"><div><b>${es.filter(e=>e.k==='quick').length}</b><span>Quick</span></div><div><b>${es.filter(e=>e.k==='deep').length}</b><span>Deep</span></div><div><b>${es.filter(e=>e.k==='verified').length}</b><span>Verified</span></div></div></section><section class="actions">${button("quick")}${button("deep")}${button("verified")}</section><div class="tools"><button onclick="undo()" ${events.length?'':'disabled'}>↩ Undo last</button><button onclick="setTab('history')">View history ›</button></div><section class="summary"><div class="summaryTitle">Today's activity <span>${es.length} actions</span></div>${es.slice(0,8).map(row).join('')||'<div class="empty">No activity yet. Start sourcing.</div>'}</section>`}
function button(k){let x=T[k];return `<button class="action ${x.c}" onclick="add('${k}')"><span class="plus">+${x.t}</span><span><strong>${x.n.toUpperCase()}${k==='verified'?' PRODUCT':' ANALYSIS'}</strong><small>${x.d}</small></span><span>›</span></button>`}
function undo(){if(events.length){events.shift();save();render()}}
function history(){let g={};events.forEach(e=>(g[e.date]??=[]).push(e));let b=Object.keys(g).sort().reverse().map(d=>`<section class="day"><div><b>${d===today()?'Today':d}</b><span>${g[d].length} actions</span></div>${g[d].map(row).join('')}</section>`).join('');return `<div class="pageTitle"><button class="back" onclick="setTab('track')">‹</button><h2>History</h2></div>${b||'<div class="empty">No history yet.</div>'}`}
function settings(){return `<div class="pageTitle"><button class="back" onclick="setTab('track')">‹</button><h2>Settings</h2></div><section class="setting"><div><b>Daily tick target</b><span>How many ticks you want each day</span></div><input type="number" min="1" value="${target}" onchange="target=Math.max(1,+this.value||1);localStorage.setItem('stTarget',target);render()"></section><section class="legend"><div><span class="dot green"></span><b>Quick Analysis</b><span>+1</span></div><div><span class="dot blue"></span><b>Deep Analysis</b><span>+2</span></div><div><span class="dot yellow"></span><b>Verified Product</b><span>+3</span></div></section><button class="danger" onclick="if(confirm('Delete all sourcing activity?')){events=[];save();render()}">Delete all activity</button>`}
function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),1100)}
function render(){document.getElementById('root').innerHTML=`<div class="app"><main>${tab==='track'?track():tab==='history'?history():settings()}</main><nav><button class="${tab==='track'?'active':''}" onclick="setTab('track')">✓<span>Track</span></button><button class="${tab==='history'?'active':''}" onclick="setTab('history')">◷<span>History</span></button><button class="${tab==='settings'?'active':''}" onclick="setTab('settings')">⚙<span>Settings</span></button></nav></div>`}
render();
</script></body></html>
